<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">ViChat app icon</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17102f"/>
      <stop offset="0.55" stop-color="#09051d"/>
      <stop offset="1" stop-color="#100725"/>
    </linearGradient>
    <linearGradient id="vFill" x1="0" y1="0" x2="0.8" y2="1">
