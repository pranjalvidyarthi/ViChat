  <path d="M111 132 Q105 132 109 141 L222 351 Q230 366 244 366 Q257 366 265 351 L375 141 Q380 132 370 132 L319 132 Q307 132 301 144 L244 259 L185 144 Q179 132 167 132 Z" fill="url(#vFill)"/>
